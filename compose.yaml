name: koboflow

services:
  postgres:
    image: postgres:18
    container_name: koboflow-postgres
    environment:
      POSTGRES_USER: koboflow
      POSTGRES_PASSWORD: koboflow
      POSTGRES_DB: koboflow
      # Service database passwords
      KOBOFLOW_CORE_POSTGRES_PASSWORD: ${KOBOFLOW_CORE_POSTGRES_PASSWORD}
      KOBOFLOW_TRANSFER_POSTGRES_PASSWORD: ${KOBOFLOW_TRANSFER_POSTGRES_PASSWORD}
      KOBOFLOW_NIP_SIM_POSTGRES_PASSWORD: ${KOBOFLOW_NIP_SIM_POSTGRES_PASSWORD}
      KOBOFLOW_STATEMENT_POSTGRES_PASSWORD: ${KOBOFLOW_STATEMENT_POSTGRES_PASSWORD}
      KOBOFLOW_RECON_POSTGRES_PASSWORD: ${KOBOFLOW_RECON_POSTGRES_PASSWORD}
      KOBOFLOW_NOTIFICATION_POSTGRES_PASSWORD: ${KOBOFLOW_NOTIFICATION_POSTGRES_PASSWORD}
      LAB_KOBOFLOW_POSTGRES_PASSWORD: ${LAB_KOBOFLOW_POSTGRES_PASSWORD}
      LAB_PARTNER_POSTGRES_PASSWORD: ${LAB_PARTNER_POSTGRES_PASSWORD}
      LAB_COORDINATOR_POSTGRES_PASSWORD: ${LAB_COORDINATOR_POSTGRES_PASSWORD}
      TZ: Africa/Lagos

    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "max_prepared_transactions=20"
      - "-c"
      - "timezone=UTC"
    ports:
      - "${KOBOFLOW_POSTGRES_PORT:-5435}:5432"
    volumes:
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koboflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KOBOFLOW_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    ports:
    - "${KOBOFLOW_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KOBOFLOW_KAFKA_PORT:-9092}"]
      interval: 10s
      timeout: 10s
      retries: 15


  redis:
    image: redis:7.0.11
    container_name: koboflow-redis
    ports:
      - "${KOBOFLOW_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  kafkadata:
  redisdata: